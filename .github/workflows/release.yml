name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: pack both release tarballs
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm pack
          cp "dsh-message-rewind-${version}.tgz" dsh-message-rewind.tgz
      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "dsh-message-rewind $GITHUB_REF_NAME" \
            --notes-from-tag \
            "dsh-message-rewind-${version}.tgz" dsh-message-rewind.tgz
